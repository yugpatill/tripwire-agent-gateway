name: bench-classifier

# Manual only: measures detector latency on a GitHub-hosted x86-64 Linux runner,
# either for a published artifact (artifact_url + artifact_sha256) or for
# untrained int8 probes (real architecture, random weights).
on:
  workflow_dispatch:
    inputs:
      models:
        description: "Space-separated base models for untrained probes (empty: none)"
        default: "microsoft/deberta-v3-small microsoft/deberta-v3-base"
      threads:
        description: "Space-separated intra-op thread counts"
        default: "1 2"
      artifact_url:
        description: "Release tarball of a trained artifact (benchmarked first, on the same runner as the probes)"
        default: ""
      artifact_sha256:
        description: "SHA-256 of artifact_url (required with it)"
        default: ""

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: CPU info
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "SIMD: $(grep -o -w -E 'avx2|avx512f|avx512_vnni|avx_vnni' /proc/cpuinfo | sort -u | tr '\n' ' ')" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Download artifact
        if: inputs.artifact_url != ''
        env:
          URL: ${{ inputs.artifact_url }}
          SHA: ${{ inputs.artifact_sha256 }}
        run: |
          test -n "$SHA" || { echo "artifact_sha256 is required" >&2; exit 1; }
          curl -fsSL "$URL" -o /tmp/artifact.tar.gz
          echo "$SHA  /tmp/artifact.tar.gz" | sha256sum -c -
          mkdir -p ml/artifacts/release && tar -xzf /tmp/artifact.tar.gz -C ml/artifacts/release --strip-components=1
          echo "Artifact: $URL" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Benchmark artifact
        if: inputs.artifact_url != ''
        working-directory: gateway
        run: |
          uv sync --frozen
          for t in ${{ inputs.threads }}; do
            echo "### release artifact, threads=$t" | tee -a "$GITHUB_STEP_SUMMARY"
            TRIPWIRE_CLASSIFIER_DIR=../ml/artifacts/release uv run python -u scripts/bench_detectors.py --threads "$t" \
              | grep -E "^\||CPU" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          ls -l ../ml/artifacts/release/model.int8.onnx | awk '{printf "model.int8.onnx: %.0f MB\n\n", $5/1e6}' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Export probes
        if: inputs.models != ''
        working-directory: ml
        run: |
          uv sync --frozen
          for m in ${{ inputs.models }}; do uv run python scripts/latency_probe.py --base "$m"; done
      - name: Benchmark probes
        if: inputs.models != ''
        working-directory: gateway
        run: |
          uv sync --frozen
          for m in ${{ inputs.models }}; do
            dir="../ml/artifacts/latency-probe-${m##*/}"
            for t in ${{ inputs.threads }}; do
              echo "### ${m##*/}, threads=$t" | tee -a "$GITHUB_STEP_SUMMARY"
              TRIPWIRE_CLASSIFIER_DIR="$dir" uv run python -u scripts/bench_detectors.py --threads "$t" \
                | grep -E "^\||CPU" | tee -a "$GITHUB_STEP_SUMMARY"
            done
            ls -l "$dir/model.int8.onnx" | awk '{printf "model.int8.onnx: %.0f MB\n\n", $5/1e6}' | tee -a "$GITHUB_STEP_SUMMARY"
          done
