# Local development stack. `docker compose up` (or `make dev`).
# Optional tracing backend: `docker compose --profile observability up`.
# Mock MCP servers (playground and MCP proxy demo) run in `mock-mcp`.

name: tripwire

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tripwire
      POSTGRES_PASSWORD: tripwire
      POSTGRES_DB: tripwire
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripwire -d tripwire"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  gateway:
    image: tripwire-gateway-dev
    build:
      context: ./gateway
      target: dev
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://tripwire:tripwire@postgres:5432/tripwire
      REDIS_URL: redis://redis:6379/0
      TRIPWIRE_POLICY_PATH: /app/policies/demo.yaml
      TRIPWIRE_CLASSIFIER_DIR: /app/models/injection-classifier
      TRIPWIRE_MCP_UPSTREAMS: /app/mcp/upstreams.docker.yaml
    ports: ["8000:8000"]
    volumes:
      - ./gateway/src:/app/src
      - ./gateway/alembic:/app/alembic
      - ./gateway/policies:/app/policies
      - ./gateway/mcp:/app/mcp
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mock-mcp: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Six mock MCP servers at http://mock-mcp:9100/<name>/mcp (calculator is poisoned,
  # weather rug-pulls after its first call). POST /reset restores them.
  mock-mcp:
    image: tripwire-gateway-dev
    build:
      context: ./gateway
      target: dev
    command: ["python", "-m", "tripwire.playground.mock_servers", "--host", "0.0.0.0", "--port", "9100"]
    ports: ["127.0.0.1:9100:9100"]
    volumes:
      - ./gateway/src:/app/src
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ./web
      target: dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/v1/stream
      WATCHPACK_POLLING: "true"
    ports: ["3000:3000"]
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      gateway: { condition: service_healthy }

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: [observability]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4318:4318"]

volumes:
  pgdata:
