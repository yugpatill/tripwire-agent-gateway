[project]
name = "tripwire-gateway"
version = "0.1.0"
description = "Tripwire: security gateway for LLM agents"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "anthropic>=0.40",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30,<1",
    "en-core-web-sm",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "onnxruntime>=1.20,<2",
    "presidio-analyzer>=2.2.355,<3",
    "presidio-anonymizer>=2.2.355,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyyaml>=6.0.2,<7",
    "redis>=5.2,<7",
    "spacy>=3.8,<3.9",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "structlog>=24.4",
    "tokenizers>=0.20,<1",
    "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
tripwire = "tripwire.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripwire"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"scripts/**" = ["S311"]
# Regex rule tables read better unwrapped.
"src/tripwire/pipeline/heuristics.py" = ["E501"]
"src/tripwire/pipeline/secrets.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs live Postgres and Redis (TRIPWIRE_TEST_DATABASE_URL / TRIPWIRE_TEST_REDIS_URL)"]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "onnx>=1.17",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261113",
]
