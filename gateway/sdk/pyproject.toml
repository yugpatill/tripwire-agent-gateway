[project]
name = "tripwire-guard"
version = "0.1.0"
description = "Guard an LLM agent's tool calls with a Tripwire gateway: Anthropic tool use, LangGraph, OpenAI Agents SDK."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3"]
openai-agents = ["openai-agents"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripwire_guard"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.mypy]
strict = true
packages = ["tripwire_guard"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain_core.*", "agents.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: needs a running Tripwire gateway (TRIPWIRE_URL, TRIPWIRE_API_KEY)"]
